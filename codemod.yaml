schema_version: "1.0"

name: "bytestrone-ef-migration-assessment-bundle"
version: "1.0.16"
description: "Read-only Entity Framework migration assessment miner scanning .NET repositories for EF6/EF Core readiness, API risks, and effort metrics."
author: "bijo abraham"
license: "MIT"

targets:
  languages:
    - "csharp"
    - "javascript"
    - "html"
    - "xml"

keywords: ["mining", "assessment", "ef-migration", "insights", "dotnet"]

registry:
  access: "private"
  visibility: "private"

capabilities:
  - "fs"

workflows:
  - name: main
    default: true
    path: workflow.yaml
