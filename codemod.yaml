schema_version: "1.0"

name: "bytestrone-ef-migration-assessment-bundle"
version: "1.1.4"
description: "Read-only Entity Framework migration assessment bundle. Delegates C# pattern/inventory/config/dependency mining to bytestrone-ef-csharp-pattern-mining and documents the Insights dashboard formulas for readiness, risk, and effort scores."
author: "bijo abraham"
license: "MIT"

targets:
  languages:
    - "csharp"

keywords: ["mining", "assessment", "ef-migration", "insights", "dotnet"]

registry:
  access: "private"
  visibility: "private"

capabilities: []

workflows:
  - name: main
    default: true
    path: workflow.yaml
